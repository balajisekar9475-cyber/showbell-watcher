name: ShowBell Movie Ticket Watcher

on:
  schedule:
    # Runs every 10 minutes (minimum allowed by GitHub Actions is every 5 minutes)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Lets you click "Run workflow" manually to test anytime

permissions:
  contents: write

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run movie ticket watcher
        env:
          TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}
          VOICE_LANG: "en-IN-Standard-A"
        run: python watcher.py

      - name: Save notified state to avoid duplicate calls
        run: |
          if [[ -n $(git status --porcelain notified_state.json) ]]; then
            git config user.name "showbell-bot"
            git config user.email "showbell-bot@users.noreply.github.com"
            git add notified_state.json
            git commit -m "Mark notified movies"
            git push
          fi